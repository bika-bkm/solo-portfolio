<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بي | تواصل معي</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        .form-group {
            margin-bottom: 1.5rem;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(139, 92, 246, 0.2);
            background: rgba(22, 26, 35, 0.4);
            color: var(--text-color);
        }

        .light-theme .form-control {
            background: #fff;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
        }
    </style>
</head>

<body class="dark-theme">
    <div id="mouse-aura"></div>

    <nav class="navbar">
        <div class="logo">PORTFOLIO</div>
        <ul class="nav-links">
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="about.html">نبذة عني</a></li>
            <li><a href="contact.html" class="active">اتصل بي</a></li>
        </ul>
        <button id="theme-toggle" class="theme-btn"><span class="icon">🔮</span></button>
    </nav>

    <main class="container" style="padding-top: 120px; padding-bottom: 60px;">
        <section class="portal-card" style="max-width: 600px; margin: 0 auto;">
            <h2 style="color: var(--accent-color); margin-bottom: 1.5rem;">أرسل رسالة فورية</h2>

            <!-- تعديل وسم الفورم وإضافة ID -->
            <form id="contact-form">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" name="name" class="form-control" placeholder="أدخل اسمك هنا" required>
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" name="_replyto" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>نص الرسالة</label>
                    <textarea name="message" class="form-control" rows="5" placeholder="اكتب رسالتك هنا..."
                        required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; border: none; cursor: pointer;">إرسال
                    الطاقة والرسالة </button>
            </form>

            <!-- مكان ظهور رسالة النجاح -->
            <div id="form-status" style="margin-top: 1rem; text-align: center; font-weight: bold; display: none;"></div>


        </section>
    </main>
    <script src="js/main.js"></script>
</body>

</html>
